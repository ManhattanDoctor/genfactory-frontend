name: GENFACTORY - BUILD
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        description: Published container digest
        value: ${{ jobs.build.outputs.digest }}
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  existing-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    outputs:
      verified: ${{ steps.checks.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: checks
        with:
          script: |
            const reuseCi = require('./scripts/reuse-ci.cjs');
            await reuseCi({ github, context, core });
  checks:
    needs: existing-checks
    if: needs.existing-checks.outputs.verified != 'true'
    uses: ./.github/workflows/ci.yml
  build:
    needs: [existing-checks, checks]
    if: >-
      ${{ !cancelled() && needs.existing-checks.result == 'success' &&
          (needs.existing-checks.outputs.verified == 'true' || needs.checks.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: /api
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}/genfactory-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: docker/genfactory/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Release reference
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Published \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
