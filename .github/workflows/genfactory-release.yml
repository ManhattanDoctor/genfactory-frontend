name: GENFACTORY - RELEASE (build + deploy)
on:
  workflow_dispatch:
    inputs:
      demo:
        description: Deploy to genfactory.ru
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  build:
    uses: ./.github/workflows/genfactory-build.yml
    with:
      demo: ${{ inputs.demo }}
    secrets: inherit
  deploy:
    needs: build
    uses: ./.github/workflows/genfactory-deploy.yml
    with:
      demo: ${{ inputs.demo }}
      digest: ${{ needs.build.outputs.digest }}
    secrets: inherit
