name: Frontend checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the complete browser regression suite
        type: boolean
        default: true
  workflow_call:
    inputs:
      full_regression:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: ${{ inputs.full_regression && 'Full browser regression' || 'Browser smoke checks' }}
        run: ${{ inputs.full_regression && 'npm run test:e2e' || 'npm run test:e2e:smoke' }}
      - run: npm run test:sw
      - name: Check deployment scripts
        run: bash -n scripts/deploy.sh scripts/container-smoke.sh && sh -n docker/genfactory/15-check-api.sh
      - name: Build runtime image
        run: docker build -f docker/genfactory/Dockerfile -t genfactory-check .
      - name: Check nginx configuration
        run: docker run --rm genfactory-check nginx -t
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
      - name: Check runtime routes and proxy
        run: bash scripts/container-smoke.sh genfactory-check
