name: Frontend checks
on:
  push:
    branches: ['**']
    tags-ignore: ['astra-*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the complete browser regression suite
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_regression:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Prepare browser
        env:
          FULL_REGRESSION: ${{ inputs.full_regression }}
        run: |
          if [[ "$FULL_REGRESSION" != true ]] && google-chrome --version; then
            echo 'PLAYWRIGHT_CHROME_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps --only-shell chromium
          fi
      - name: ${{ inputs.full_regression && 'Full browser regression' || 'Browser smoke checks' }}
        run: ${{ inputs.full_regression && 'npm run test:e2e:full' || 'npm run test:e2e:smoke' }}
      - run: npm run test:sw
      - name: Check mobile Studio in WebKit
        run: |
          npx playwright install --with-deps webkit
          npx playwright test --config playwright.mobile-webkit.config.ts
      - name: Check deployment scripts
        run: bash -n scripts/deploy.sh scripts/container-smoke.sh && sh -n docker/genfactory/15-check-api.sh
      - name: Build runtime image
        run: docker build -f docker/genfactory/Dockerfile -t genfactory-check .
      - name: Check nginx configuration
        run: docker run --rm genfactory-check nginx -t
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
      - name: Check runtime routes and proxy
        run: bash scripts/container-smoke.sh genfactory-check
